name: CoinCoach Square live — 96 posts per day per account

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: Trigger source
        required: true
        default: manual
        type: choice
        options:
          - manual
          - cloudflare
      confirmation:
        description: Type RUN_LIVE_SLOT for a manual post
        required: true
        type: string

permissions:
  contents: read

# Keep one 15-minute slot active at a time. Individual API accounts run as
# independent matrix jobs inside that slot, so one slow API cannot block another.
concurrency:
  group: coincoach-square-live-slot
  cancel-in-progress: false

jobs:
  publish-account:
    # External slots only run while the repository kill switch is enabled.
    # Manual runs still require the explicit RUN_LIVE_SLOT confirmation below.
    if: ${{ inputs.trigger_source == 'manual' || vars.COINCOACH_LIVE_96_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - account_id: account_01
            square_secret_name: BINANCE_SQUARE_KEY_ACCOUNT_01
            discord_secret_name: DISCORD_WEBHOOK_URL_ACCOUNT_01
            facebook_page_id_secret_name: FACEBOOK_PAGE_ID_ACCOUNT_01
            facebook_token_secret_name: FACEBOOK_PAGE_ACCESS_TOKEN_ACCOUNT_01
            instagram_user_id_secret_name: INSTAGRAM_USER_ID_ACCOUNT_01
            instagram_token_secret_name: INSTAGRAM_ACCESS_TOKEN_ACCOUNT_01
            threads_user_id_secret_name: THREADS_USER_ID_ACCOUNT_01
            threads_token_secret_name: THREADS_ACCESS_TOKEN_ACCOUNT_01
            cloudinary_cloud_name_secret_name: CLOUDINARY_CLOUD_NAME_ACCOUNT_01
            cloudinary_api_key_secret_name: CLOUDINARY_API_KEY_ACCOUNT_01
            cloudinary_api_secret_secret_name: CLOUDINARY_API_SECRET_ACCOUNT_01
          - account_id: account_02
            square_secret_name: BINANCE_SQUARE_KEY_ACCOUNT_02
            discord_secret_name: DISCORD_WEBHOOK_URL_ACCOUNT_02
            facebook_page_id_secret_name: FACEBOOK_PAGE_ID_ACCOUNT_02
            facebook_token_secret_name: FACEBOOK_PAGE_ACCESS_TOKEN_ACCOUNT_02
            instagram_user_id_secret_name: INSTAGRAM_USER_ID_ACCOUNT_02
            instagram_token_secret_name: INSTAGRAM_ACCESS_TOKEN_ACCOUNT_02
            threads_user_id_secret_name: THREADS_USER_ID_ACCOUNT_02
            threads_token_secret_name: THREADS_ACCESS_TOKEN_ACCOUNT_02
            cloudinary_cloud_name_secret_name: CLOUDINARY_CLOUD_NAME_ACCOUNT_02
            cloudinary_api_key_secret_name: CLOUDINARY_API_KEY_ACCOUNT_02
            cloudinary_api_secret_secret_name: CLOUDINARY_API_SECRET_ACCOUNT_02
          - account_id: account_03
            square_secret_name: BINANCE_SQUARE_KEY_ACCOUNT_03
            discord_secret_name: DISCORD_WEBHOOK_URL_ACCOUNT_03
            facebook_page_id_secret_name: FACEBOOK_PAGE_ID_ACCOUNT_03
            facebook_token_secret_name: FACEBOOK_PAGE_ACCESS_TOKEN_ACCOUNT_03
            instagram_user_id_secret_name: INSTAGRAM_USER_ID_ACCOUNT_03
            instagram_token_secret_name: INSTAGRAM_ACCESS_TOKEN_ACCOUNT_03
            threads_user_id_secret_name: THREADS_USER_ID_ACCOUNT_03
            threads_token_secret_name: THREADS_ACCESS_TOKEN_ACCOUNT_03
            cloudinary_cloud_name_secret_name: CLOUDINARY_CLOUD_NAME_ACCOUNT_03
            cloudinary_api_key_secret_name: CLOUDINARY_API_KEY_ACCOUNT_03
            cloudinary_api_secret_secret_name: CLOUDINARY_API_SECRET_ACCOUNT_03
          - account_id: account_04
            square_secret_name: BINANCE_SQUARE_KEY_ACCOUNT_04
            discord_secret_name: DISCORD_WEBHOOK_URL_ACCOUNT_04
            facebook_page_id_secret_name: FACEBOOK_PAGE_ID_ACCOUNT_04
            facebook_token_secret_name: FACEBOOK_PAGE_ACCESS_TOKEN_ACCOUNT_04
            instagram_user_id_secret_name: INSTAGRAM_USER_ID_ACCOUNT_04
            instagram_token_secret_name: INSTAGRAM_ACCESS_TOKEN_ACCOUNT_04
            threads_user_id_secret_name: THREADS_USER_ID_ACCOUNT_04
            threads_token_secret_name: THREADS_ACCESS_TOKEN_ACCOUNT_04
            cloudinary_cloud_name_secret_name: CLOUDINARY_CLOUD_NAME_ACCOUNT_04
            cloudinary_api_key_secret_name: CLOUDINARY_API_KEY_ACCOUNT_04
            cloudinary_api_secret_secret_name: CLOUDINARY_API_SECRET_ACCOUNT_04
          - account_id: account_05
            square_secret_name: BINANCE_SQUARE_KEY_ACCOUNT_05
            discord_secret_name: DISCORD_WEBHOOK_URL_ACCOUNT_05
            facebook_page_id_secret_name: FACEBOOK_PAGE_ID_ACCOUNT_05
            facebook_token_secret_name: FACEBOOK_PAGE_ACCESS_TOKEN_ACCOUNT_05
            instagram_user_id_secret_name: INSTAGRAM_USER_ID_ACCOUNT_05
            instagram_token_secret_name: INSTAGRAM_ACCESS_TOKEN_ACCOUNT_05
            threads_user_id_secret_name: THREADS_USER_ID_ACCOUNT_05
            threads_token_secret_name: THREADS_ACCESS_TOKEN_ACCOUNT_05
            cloudinary_cloud_name_secret_name: CLOUDINARY_CLOUD_NAME_ACCOUNT_05
            cloudinary_api_key_secret_name: CLOUDINARY_API_KEY_ACCOUNT_05
            cloudinary_api_secret_secret_name: CLOUDINARY_API_SECRET_ACCOUNT_05
          - account_id: account_06
            square_secret_name: BINANCE_SQUARE_KEY_ACCOUNT_06
            discord_secret_name: DISCORD_WEBHOOK_URL_ACCOUNT_06
            facebook_page_id_secret_name: FACEBOOK_PAGE_ID_ACCOUNT_06
            facebook_token_secret_name: FACEBOOK_PAGE_ACCESS_TOKEN_ACCOUNT_06
            instagram_user_id_secret_name: INSTAGRAM_USER_ID_ACCOUNT_06
            instagram_token_secret_name: INSTAGRAM_ACCESS_TOKEN_ACCOUNT_06
            threads_user_id_secret_name: THREADS_USER_ID_ACCOUNT_06
            threads_token_secret_name: THREADS_ACCESS_TOKEN_ACCOUNT_06
            cloudinary_cloud_name_secret_name: CLOUDINARY_CLOUD_NAME_ACCOUNT_06
            cloudinary_api_key_secret_name: CLOUDINARY_API_KEY_ACCOUNT_06
            cloudinary_api_secret_secret_name: CLOUDINARY_API_SECRET_ACCOUNT_06
    env:
      APP_ENV: github-actions-live-96-per-day-parallel
      ACTIVE_ACCOUNT_ID: ${{ matrix.account_id }}
      BINANCE_SQUARE_KEY_ACTIVE: ${{ secrets[matrix.square_secret_name] }}
      DATABASE_PATH: data/state/${{ matrix.account_id }}/coincoach.db
      PUBLISH_LEDGER_PATH: data/state/${{ matrix.account_id }}/publish_ledger.json
      ACCOUNT_ACTIVATION_MODE: key_present
      PUBLISH_ENABLED: "true"
      LIVE_PUBLISH_APPROVED: "true"
      POSTS_PER_ACCOUNT_PER_RUN: "1"
      LIVE_EXPECTED_POSTS_PER_HOUR: "4"
      PER_ACCOUNT_DAILY_LIMIT: "96"
      LIVE_RESERVE_CANDIDATES: "4"
      LIVE_OUTER_CAPTURE_ATTEMPTS: "2"
      LIVE_RETRY_DELAY_SECONDS: "2"
      SYMBOL_COOLDOWN_HOURS: "1"
      STATELESS_SLOT_ROTATION: "true"
      WEB_CAPTURE_ENABLED: "true"
      RENDERED_CHART_ENABLED: "false"
      MOBILE_CAPTURE_ENABLED: "false"

      # Optional per-account social fan-out.
      # The same post is sent to a connected destination only after Square
      # succeeds. If no destination credentials are present for this account,
      # the result is Binance-only.
      SOCIAL_SYNDICATION_ENABLED: "true"
      SOCIAL_LIVE_APPROVED: ${{ vars.COINCOACH_SOCIAL_LIVE_APPROVED || 'false' }}
      SOCIAL_STATE_PATH: data/state/${{ matrix.account_id }}/social_delivery_state.json
      SOCIAL_PENDING_RETRY_LIMIT: "1"
      SOCIAL_REQUEST_TIMEOUT_SECONDS: "45"

      # Enable checks are on; the application only activates a platform when
      # its complete per-account credentials are actually present.
      DISCORD_PUBLISH_ENABLED: "true"
      FACEBOOK_PUBLISH_ENABLED: "true"
      INSTAGRAM_PUBLISH_ENABLED: "true"
      THREADS_PUBLISH_ENABLED: "true"

      DISCORD_WEBHOOK_URL: ${{ secrets[matrix.discord_secret_name] }}
      FACEBOOK_PAGE_ID: ${{ secrets[matrix.facebook_page_id_secret_name] }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets[matrix.facebook_token_secret_name] }}
      INSTAGRAM_USER_ID: ${{ secrets[matrix.instagram_user_id_secret_name] }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets[matrix.instagram_token_secret_name] }}
      THREADS_USER_ID: ${{ secrets[matrix.threads_user_id_secret_name] }}
      THREADS_ACCESS_TOKEN: ${{ secrets[matrix.threads_token_secret_name] }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets[matrix.cloudinary_cloud_name_secret_name] }}
      CLOUDINARY_API_KEY: ${{ secrets[matrix.cloudinary_api_key_secret_name] }}
      CLOUDINARY_API_SECRET: ${{ secrets[matrix.cloudinary_api_secret_secret_name] }}
      CLOUDINARY_FOLDER: coincoach-signals
      META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
      THREADS_API_BASE_URL: ${{ vars.THREADS_API_BASE_URL || 'https://graph.threads.net/v1.0' }}

    steps:
      - name: Validate live-slot trigger
        shell: bash
        run: |
          source="${{ inputs.trigger_source }}"
          confirmation="${{ inputs.confirmation }}"

          if [ "$source" = "manual" ]; then
            if [ "$confirmation" != "RUN_LIVE_SLOT" ]; then
              echo "Manual confirmation must be RUN_LIVE_SLOT"
              exit 1
            fi
          elif [ "$source" = "cloudflare" ]; then
            if [ "$confirmation" != "CLOUDFLARE_SLOT" ]; then
              echo "External confirmation must be CLOUDFLARE_SLOT"
              exit 1
            fi
          else
            echo "Unsupported trigger source: $source"
            exit 1
          fi

      - name: Detect configured API account
        id: account-key
        shell: bash
        env:
          ACCOUNT_KEY: ${{ secrets[matrix.square_secret_name] }}
        run: |
          if [ -n "$ACCOUNT_KEY" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.account_id }} is active"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.account_id }} has no configured API key; skipping this matrix job"
          fi

      - name: Check out project
        if: steps.account-key.outputs.active == 'true'
        uses: actions/checkout@v6

      - name: Set up Python
        if: steps.account-key.outputs.active == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        if: steps.account-key.outputs.active == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Restore isolated account state
        if: steps.account-key.outputs.active == 'true'
        uses: actions/cache@v4
        with:
          path: data/state/${{ matrix.account_id }}
          key: coincoach-live-state-${{ matrix.account_id }}-${{ github.run_id }}
          restore-keys: |
            coincoach-live-state-${{ matrix.account_id }}-

      - name: Install Python packages
        if: steps.account-key.outputs.active == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium for Playwright
        if: steps.account-key.outputs.active == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install official Binance Square Post Skill
        if: steps.account-key.outputs.active == 'true'
        shell: bash
        run: |
          git clone --depth 1 https://github.com/binance/binance-skills-hub.git .binance-skills-hub
          SKILL_DIR="$GITHUB_WORKSPACE/.binance-skills-hub/skills/binance/square-post"
          test -f "$SKILL_DIR/scripts/post-image.mjs"
          echo "BINANCE_SQUARE_SKILL_DIR=$SKILL_DIR" >> "$GITHUB_ENV"

      - name: Generate one verified chart and publish for this API account
        if: steps.account-key.outputs.active == 'true'
        run: python -m scripts.run_square_slot

      - name: Upload isolated account artifact
        if: ${{ always() && steps.account-key.outputs.active == 'true' }}
        uses: actions/upload-artifact@v5
        with:
          name: coincoach-live-${{ matrix.account_id }}-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 2
